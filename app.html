<!DOCTYPE html>

<head>

<meta name="description" content="The Al Mannai Gym member app, free on the App Store and Google Play.">
<!--
  almannaigym.com/app — the address on the gym-floor TV video and its QR code.
  vercel.json sends iPhones straight to the App Store and Android phones to

-->
<link rel="icon" type="image/png" href="assets/logo/AMG-logo-chrome.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Barlow:wght@500&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:#0A0A0A;color:#F2F2F0}
  body{font-family:'Barlow',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 16px}

  .rule{width:56px;height:4px;background:#E10600;margin:0 auto 26px}

  p.ar{margin-top:4px;font-weight:600;font-size:18px}
  .stores{display:flex;flex-direction:column;gap:14px;margin-top:36px}
  .stores a{display:block;padding:18px;border:1px solid #2C3D47;border-radius:999px;background:#121A1F;color:#F2F2F0;
    font-family:'Oswald',sans-serif;font-weight:500;font-size:20px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
  .stores a:hover,.stores a:focus-visible{border-color:#E10600;outline:none}

  <p class="ar" lang="ar">مجانا على iPhone وAndroid</p>
  <div class="stores">
    <a href="https://apps.apple.com/bh/app/id6814225150">App Store</a>
    <a href="https://play.google.com/store/apps/details?id=com.almannaigym.app">Google Play</a>
  </div>
  <a class="home" href="/">almannaigym.com</a>
</main>
</body>
